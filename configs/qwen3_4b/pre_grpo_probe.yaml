seed: 42

model:
  name: Qwen/Qwen3-4B-Base
  revision: main
  trust_remote_code: false
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  compute_dtype: bfloat16
  use_im_end_as_eos: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - lm_head

initialization:
  adapter_path: out/stage2/qwen3_4b/sft_lm_head_w8_s42_adapter

probe:
  pools:
    validation: data/processed/gsm8k_agent/validation_rl.jsonl
  output_dir: out/stage2/qwen3_4b/pre_grpo_probe_s42
  device: cuda:0
  max_prompt_length: 1024
  num_generations: 8
  max_turns: 3
  max_new_tokens: 384
  temperature: 1.0
  top_k: 0
  top_p: 1.0
