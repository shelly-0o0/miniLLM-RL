model:
  name: Qwen/Qwen3-4B-Base
  revision: main
  trust_remote_code: false
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  compute_dtype: bfloat16
  use_im_end_as_eos: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - lm_head

runs:
  - label: additional_sft_b_zero_shot
    adapter_path: out/stage2_track2/qwen3_4b/additional_sft_b_s42_adapter
  - label: svamp_grpo
    adapter_path: out/stage2_svamp/qwen3_4b/grpo_s42_adapter

evaluation:
  require_all_runs: true
  test_path: data/processed/svamp_agent/holdout_rl.jsonl
  output_dir: out/stage2_svamp/qwen3_4b/evaluation
  device: cuda:0
  limit: 0
  decode_seeds: [42]
  max_prompt_length: 1024
  max_turns: 3
  max_new_tokens: 384
  temperature: 1.0
  top_k: 0
  top_p: 1.0
