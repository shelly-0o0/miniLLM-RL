seed: 42

model:
  name: Qwen/Qwen3-4B-Base
  revision: main
  trust_remote_code: false
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  compute_dtype: bfloat16
  use_im_end_as_eos: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules: all-linear

initialization:
  adapter_path: null

data:
  train_path: data/processed/gsm8k_track2/a_sft.jsonl
  max_length: 1536
  audit_samples: 128

training:
  device: cuda:0
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  epochs: 1
  max_steps: 0
  learning_rate: 1.0e-4
  # 1.0 reproduces ordinary assistant-token CE. Repair runs override this
  # from the CLI without changing or overwriting the original formal run.
  structure_token_weight: 1.0
  weight_decay: 0.0
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  bf16: true
  fp16: false
  optim: adamw_torch
  logging_steps: 5
  save_steps: 100
  save_total_limit: 2
  num_workers: 0

output:
  trainer_dir: checkpoints/stage2_track2/qwen3_4b/agent_sft_a_s42
  adapter_dir: out/stage2_track2/qwen3_4b/agent_sft_a_s42_adapter
  metrics_path: out/metrics/track2_qwen3_4b_agent_sft_a_s42.jsonl
