seed: 42

model:
  name: Qwen/Qwen3-4B-Base
  revision: main
  trust_remote_code: false
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  compute_dtype: bfloat16
  use_im_end_as_eos: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules: all-linear

initialization:
  adapter_path: null

data:
  train_path: data/processed/gsm8k_agent/train_rl.jsonl
  max_prompt_length: 1024

rollout:
  num_generations: 4
  max_turns: 3
  max_new_tokens: 128
  max_total_length: 1536
  temperature: 1.0
  top_k: 0
  top_p: 1.0

training:
  policy_device: cuda:0
  reference_device: cuda:1
  batch_size: 1
  gradient_accumulation_steps: 1
  epochs: 1
  max_candidate_groups: 2
  policy_update_epochs: 1
  learning_rate: 1.0e-6
  weight_decay: 0.0
  beta: 0.02
  epsilon: 0.2
  max_grad_norm: 1.0
  max_rollout_logprob_mae: 0.1
  logging_steps: 1
  save_steps: 1

output:
  run_name: qwen3_4b_smoke_pure_grpo_s42
  checkpoint_dir: checkpoints/stage2/qwen3_4b/smoke_pure_grpo_s42
  adapter_dir: out/stage2/qwen3_4b/smoke_pure_grpo_s42_adapter
  metrics_path: out/metrics/qwen3_4b_smoke_pure_grpo_s42.jsonl
